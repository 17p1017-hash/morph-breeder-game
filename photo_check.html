<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>複合モルフの画像接続チェック</title><style>body{font-family:system-ui;padding:16px;background:#f5f8f7;color:#17322b}.a{background:white;border-radius:12px;padding:12px;margin:12px 0}img{max-width:100%;max-height:220px;object-fit:contain}.ok{color:green}.fail{color:#c42}</style><h2>複合モルフ画像の接続チェック</h2><p>画像を表示できれば「表示成功」、できなければ「読み込み失敗」。外部の直リンクはサイト側が拒否することがあります。</p><div id="list"></div><script src="external_photos.js"></script><script>const box=document.getElementById('list');for(const p of VERIFIED_REMOTE_PHOTOS){const d=document.createElement('div');d.className='a';const h=document.createElement('b');h.textContent=p.name;const stat=document.createElement('p');stat.textContent='確認中';const img=new Image();img.onload=()=>{stat.textContent='表示成功';stat.className='ok';};img.onerror=()=>{stat.textContent='読み込み失敗（リンク切れ・直リンク制限など）';stat.className='fail';};img.src=p.url;d.append(h,stat,img);box.append(d)}</script></html>
